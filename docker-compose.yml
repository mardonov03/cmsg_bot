version: '3.8'

services:
  bot:
    build: .
    container_name: cmsg-bot
    restart: always
    env_file:
      - .env
    environment:
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: cmsg
      DB_HOST: db
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: cmsg-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cmsg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
